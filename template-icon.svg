<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15171A"/>
      <stop offset="100%" stop-color="#00BD9D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="120" fill="url(#bg)"/>
  <!-- Mermaid tail shape -->
  <g transform="translate(400, 380)">
    <!-- Upper body / torso curves -->
    <path d="M-70,-120 
             C-30,-180 30,-180 70,-120 
             C85,-90 80,-50 70,-20"
          stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M-70,-120 
             C-85,-90 -80,-50 -70,-20"
          stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Connecting torso -->
    <path d="M-70,-20 C-40,10 40,10 70,-20"
          stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Tail fin - flowing curves -->
    <path d="M-70,-20 
             C-120,40 -170,100 -140,150
             C-120,180 -80,160 -50,130
             C-30,110 -20,90 -5,60"
          stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M70,-20 
             C120,40 170,100 140,150
             C120,180 80,160 50,130
             C30,110 20,90 5,60"
          stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Tail center vein -->
    <path d="M-5,5 C-15,40 0,80 0,110"
          stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M5,5 C15,40 0,80 0,110"
          stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- Inner fin detail -->
    <path d="M-140,150 C-100,140 -70,160 -50,130" 
          stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M140,150 C100,140 70,160 50,130" 
          stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
    <!-- Connection dots -->
    <circle cx="-5" cy="5" r="4" fill="#FFFFFF"/>
    <circle cx="5" cy="5" r="4" fill="#FFFFFF"/>
  </g>
</svg>
